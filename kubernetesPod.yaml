apiVersion: v1
kind: Pod
metadata:
  name: crane
  labels:
    ci: crane-build
spec:
  hostUsers: false
  volumes:
    - name: docker-socket
      emptyDir: { }
    - name: tmp
      emptyDir: { }
  containers:
    - name: builder
      image: public.ecr.aws/docker/library/maven:3-eclipse-temurin-21-jammy
      securityContext:
        runAsUser: 1000
        runAsGroup: 2375
      command:
        - cat
      tty: true
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker/docker.sock
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=/tmp/m2"
      volumeMounts:
        - mountPath: /var/run/docker
          name: docker-socket
        - mountPath: /tmp/
          name: tmp
      resources:
        requests:
          memory: "2Gi"
          cpu: "1.0"
        limits:
          memory: "4Gi"
          cpu: "1.5"
    - name: docker
      image: public.ecr.aws/docker/library/docker:dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker/docker.sock
      volumeMounts:
        - mountPath: /var/run/docker
          name: docker-socket
        - mountPath: /tmp/
          name: tmp
      resources:
        requests:
          memory: "2Gi"
          cpu: "1.0"
        limits:
          memory: "4Gi"
          cpu: "1.5"
