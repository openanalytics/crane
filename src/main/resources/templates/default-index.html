<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="head">
        <title th:text="${title}"></title>
    </th:block>
    <th:block th:fragment="content">
        <h1><span th:text="#{index.directoryo}"></span> <code><span class="slash">/</span><th:block th:each="part : ${breadcrumbs}"><a th:href="@{${part.path}}" th:text="${part.name}"></a><span class="slash">/</span></th:block>
        </code></h1>
        <dialog id="uppy-dialog">
            <div id="uppy" th:action="@{${resource}}"></div>
            <div class="flex flex-space-between">
                <button id="cancel-uppy-upload" type="button" class="button cancel" th:text="#{index.cancel.button}"></button>
                <button id="uppy-upload" type="button" class="button create" th:text="#{index.upload.button}"></button>
            </div>
        </dialog>

        <dialog id="create-directory-dialog">
            <form id="create-directory-form" method="post" th:action="@{${resource}}">
                <div><h1 th:text="#{index.create-directory}"></h1></div>
                <div class="input-field">
                    <label th:text="#{index.directory-name}"></label>
                    <input id="directory-name" type="text" />
                </div>
                <div class="flex flex-space-between">
                    <button id="cancel-create-directory" type="button" class="button cancel" th:text="#{index.cancel.button}"></button>
                    <button id="create-directory" type="button" class="button create" th:text="#{index.create.button}"></button>
                </div>
            </form>
        </dialog>

        <table th:attr="data-has-write-access=${hasWriteAccess}">
            <thead>
                <tr>
                    <th th:text="#{index.filename}"></th>
                    <th th:text="#{index.last_modified_time}"></th>
                    <th th:text="#{index.size}"></th>
                    <td th:text="#{index.actions}"></td>
                </tr>
            </thead>
            <tbody>
                <tr th:each="directory : ${directories}">
                    <td><a th:href="@{${directory.name} + '/'}" th:text="${directory.name + '/'}"></a></td>
                    <td></td>
                    <td></td>
                    <td>
                        <button th:if="${directory.hasWriteAccess && !directory.isPathComponent}" th:data-dirname="${directory.name}" th:data-ispathcomponent="${directory.isPathComponent}" type="button" class="delete-button danger button"
                                th:title="#{index.delete_directory}">
                            <img th:src="@{'/__assets/svg/trash-can.svg'}">
                        </button>
                        <button th:if="${directory.hasWriteAccess && directory.isPathComponent}" th:data-dirname="${directory.name}" th:data-ispathcomponent="${directory.isPathComponent}" type="button" class="delete-button danger button"
                                th:title="#{index.empty_directory}">
                            <img th:src="@{'/__assets/svg/broom.svg'}">
                        </button>
                        <span class="delete-info" th:id="${'progress-' + directory.name}"></span>
                    </td>
                </tr>

                <tr th:each="file : ${files}">
                    <td><a th:href="@{${file.name}}" th:text="${file.name}"></a></td>
                    <td th:text="${file.lastModifiedTime}"></td>
                    <td th:text="${file.formattedSize}"></td>
                    <td>
                        <button th:if="${hasWriteAccess}" th:data-filename="${file.name}" type="button" class="delete-button danger button" th:title="#{index.delete_file}">
                            <img th:src="@{'/__assets/svg/trash-can.svg'}">
                        </button>
                        <span class="delete-info" th:id="${'progress-' + file.name}"></span>
                    </td>
                </tr>
            </tbody>

        </table>
    </th:block>

</html>
