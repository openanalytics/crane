<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <div id="navbar" th:fragment="navbar">
            <header class="app-header">
                <div class="header-container">
                    <div id="navbar-start" class="brand">
                        <img class="brand-logo" th:src="${logo}" th:if="${logo != null}"/>
                        <img class="brand-logo" th:src="@{${resourcePrefix} + '/img/logo.svg' }" th:if="${logo == null}"/>
                        <a class="brand-name" th:href="@{/}" th:text="Crane"></a>
                    </div>

                    <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Toggle menu">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3" aria-hidden="true"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
                    </button>

                    <div class="header-actions" id="header-actions">
                        <div class="crane-dropdown" id="language-selector" th:if="${enabledLanguages.size() > 1}">
                            <button type="button" class="crane-btn crane-btn-ghost dropdown-toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="#e3e3e3" aria-hidden="true"><path d="m476-80 182-480h84L924-80h-84l-43-122H603L560-80h-84ZM160-200l-56-56 202-202q-35-35-63.5-80T190-640h84q20 39 40 68t48 58q33-33 68.5-92.5T484-720H40v-80h280v-80h80v80h280v80H564q-21 72-63 148t-83 116l96 98-30 82-122-125-202 201Zm468-72h144l-72-204-72 204Z"/></svg>
                                <span th:text="${language.toUpperCase()}"></span>
                                <span class="crane-caret"></span>
                            </button>
                            <ul class="crane-dropdown-menu">
                                <li th:each="lang: ${enabledLanguages}" th:data-language="${lang.key}" th:text="${lang.displayName}" th:class="${language == lang.key ? 'language-active' : ''}"></li>
                            </ul>
                        </div>

                        <a class="crane-btn crane-btn-ghost" href="?login" role="button" th:if="${!isOnlyPublic} and ${!authenticated}" th:text="#{navbar.sign_in}"></a>
                        <div class="crane-dropdown" id="user-menu" th:if="${!isOnlyPublic} and ${authenticated}">
                            <button type="button" class="crane-btn crane-btn-ghost dropdown-toggle">
                                <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="#e3e3e3" aria-hidden="true"><path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z"/></svg>
                                <span class="navbar-username" th:text="${username}"></span>
                                <span class="crane-caret"></span>
                            </button>
                            <ul class="crane-dropdown-menu">
                                <li>
                                    <form class="logout-form" method="post" th:action="@{/logout}">
                                        <input name="_csrf" type="hidden" th:value="${_csrf.token}">
                                        <button class="crane-dropdown-menu-btn" type="submit">
                                            <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="#666" class="crane-icon" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/></svg>
                                            <span th:text="#{navbar.logout}"></span>
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

            </header>
        </div>
    </body>
</html>
