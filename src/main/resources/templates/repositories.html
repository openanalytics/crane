<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <th:block th:fragment="head">
        <title>Crane</title>
    </th:block>
    <th:block th:fragment="content">
        <h1>Repositories</h1>
        <p th:if="${repositories.isEmpty()}">You do not have access to any repository.</p>
        <ul>
            <li th:each="repository: ${repositories}">
                <a th:href="@{${repository} + '/'}" th:text="${repository}"></a>
            </li>
        </ul>
    </th:block>
</html>
